<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igreja Cristã Maranata — Lista de Louvores</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  background-color: #fdfbf8;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 920px;
  margin: 20px auto;
  background: white;
  padding: 20px 30px;
  border-radius: 10px;
  box-shadow: 0 0 8px rgba(0,0,0,0.1);
}
header {
  display: flex;
  align-items: center;
  border-bottom: 2px solid #ddd;
  padding-bottom: 10px;
  margin-bottom: 20px;
}
header img {
  height: 80px;
  margin-right: 20px;
}
header h1 {
  font-size: 22px;
  margin: 0;
  color: #700;
}
header p {
  margin: 4px 0 0 0;
  color: #444;
}
header .verse {
  margin: 6px 0 0 0;
  font-style: italic;
  color: #333;
  font-size: 13px;
}
label {
  font-weight: bold;
  margin-right: 10px;
}
select, input {
  padding: 6px;
  margin-bottom: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ccc;
  padding: 6px;
  text-align: left;
}
th {
  background: #f0f0f0;
}
button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin: 4px;
}
.green { background-color: #28a745; color: white; }
.blue { background-color: #007bff; color: white; }
.red { background-color: #dc3545; color: white; }
.arrow { background: none; border: none; font-size: 16px; cursor: pointer; }
footer {
  margin-top: 20px;
  font-size: 14px;
  background: #fafafa;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}
footer .verse {
  display: block;
  font-style: italic;
  color: #333;
  margin-top: 8px;
}
a.pdf-link { text-decoration: none; }
a.pdf-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container" id="lista">
  <header>
    <img src="logo-maranata.png" alt="Igreja Cristã Maranata">
    <div>
      <h1>Igreja Cristã Maranata — Lista de Louvores</h1>
      <p>Sistema para preparar, compartilhar e exibir os louvores do culto.</p>
      <p class="verse">Apocalipse 22:20 — “Aquele que testifica estas coisas diz: Certamente, cedo venho. Amém! Ora, vem, Senhor Jesus!”</p>
    </div>
  </header>

  <div>
    <label>Coletânea</label>
    <select id="coletanea">
      <option value="geral">Coletânea de Louvores Geral</option>
      <option value="avulsos">Coletânea de Louvores Avulsos</option>
      <option value="cias">Coletânea das CIAs</option>
    </select>

    <label style="margin-left:20px;">Data do culto</label>
    <input type="date" id="dataCulto">
    <span id="diaSemana" style="margin-left:8px;font-weight:600"></span>

    <button class="blue" onclick="adicionarLouvorManual()">Adicionar Louvor Manual</button>
    <button class="red" onclick="limparLista()">Limpar lista</button>
  </div>
